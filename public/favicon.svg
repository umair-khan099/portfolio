<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark Background Frame -->
  <rect width="64" height="64" rx="16" fill="#050505"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(244, 244, 240, 0.16)" stroke-width="2"/>
  
  <defs>
    <linearGradient id="ukAccent" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Architectural Interlocking UK Monogram -->
  <g stroke="#F4F4F0" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- U-Shape Loop -->
    <path d="M 18 16 V 36 C 18 45, 34 45, 34 36 V 16"/>
    
    <!-- K Upper Diagonal Arm -->
    <path d="M 34 29 L 47 16"/>
    
    <!-- K Lower Diagonal Arm -->
    <path d="M 34 29 L 47 44"/>
  </g>

  <!-- Accent Highlight Dot -->
  <circle cx="50" cy="14" r="3.5" fill="url(#ukAccent)"/>
</svg>